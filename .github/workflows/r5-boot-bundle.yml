name: R5 boot bundle contract

on:
  push:
    branches:
      - 'feat/r5-*'
      - 'research/reproducible-build-gpu-20261123'
    paths:
      - 'scripts/research/*boot*.py'
      - 'docs/research/2026-11-23/**'
      - '.github/workflows/r5-boot-bundle.yml'
  pull_request:
    paths:
      - 'scripts/research/*boot*.py'
      - 'docs/research/2026-11-23/**'
      - '.github/workflows/r5-boot-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r5-boot-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen candidate derivation
        run: python3 -O scripts/research/derive_boot_candidate.py --check docs/research/2026-11-23/boot-candidate-r5.json
      - name: Exercise parser, provenance and dependency failures
        run: python3 -m unittest discover -s scripts/research -p 'test_boot_*.py' -v
      - name: Verify the evidence gate without asserting native readiness
        run: python3 scripts/research/qualify_boot_bundle.py --gate evidence --output /tmp/r5-evidence-gate.json
