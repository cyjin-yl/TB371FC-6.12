name: R5 Novatek signed-stage contract
on:
  pull_request:
    paths:
      - 'scripts/research/input/signing/**'
      - '.github/workflows/r5-novatek-signed-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fixture tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm openssl
      - name: Exercise actual ARM64 ELF stripping and CMS rejection
        run: python3 -O scripts/research/input/signing/test_stage_r5_novatek.py -v
      - name: Reject invalid target depmod provenance and load plans
        run: python3 -O scripts/research/input/signing/test_target_r5_depmod.py -v
