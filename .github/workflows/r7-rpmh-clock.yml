name: R7 RPMh clock construction guards

on:
  push:
    paths:
      - scripts/research/system-kernel/research7-rpmh-clock/**
      - mainline-port/backports/linux-6.12/0023-arm64-tb371fc-explicit-memblock-page-tables.patch
      - docs/research/2026-11-26/evidence/tianma-r6-build/kernel.config
      - .github/workflows/r7-rpmh-clock.yml
  pull_request:
    paths:
      - scripts/research/system-kernel/research7-rpmh-clock/**
      - mainline-port/backports/linux-6.12/0023-arm64-tb371fc-explicit-memblock-page-tables.patch
      - docs/research/2026-11-26/evidence/tianma-r6-build/kernel.config
      - .github/workflows/r7-rpmh-clock.yml

permissions:
  contents: read

jobs:
  construction-guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check R7 config, source boundaries and offline module ABI negatives
        run: python3 -B -O scripts/research/system-kernel/research7-rpmh-clock/test_rpmh_candidate.py
      - name: Check separate R7 root and initramfs construction guards
        run: python3 -B -O scripts/research/system-kernel/research7-rpmh-clock/test_rpmh_rootfs.py
      - name: Check unchanged generic VM phases and owned-process cleanup
        run: python3 -B -O scripts/research/system-kernel/research7-rpmh-clock/test_rpmh_generic_vm.py
      - name: Compile and execute the actual early allocator selector
        run: python3 -B -O scripts/research/system-kernel/research7-rpmh-clock/test_early_pgtable.py
      - name: Check bounded tool probes and actual child cleanup
        run: python3 -B -O scripts/research/system-kernel/research7-rpmh-clock/test_probe_runtime.py
